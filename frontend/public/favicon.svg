<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="careGrad" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdfa" />
    </linearGradient>
  </defs>

  <!-- Background Rounded Icon -->
  <rect width="120" height="120" rx="28" fill="url(#careGrad)" />

  <!-- Central Medical Cross Core -->
  <rect x="52" y="30" width="16" height="60" rx="8" fill="url(#accentGrad)" />
  <rect x="30" y="52" width="60" height="16" rx="8" fill="url(#accentGrad)" />

  <!-- Heart Contour -->
  <path
    d="M36 60 C36 45 48 38 60 49 C72 38 84 45 84 60 C84 75 60 88 60 88 C60 88 36 75 36 60 Z"
    fill="none"
    stroke="#ffffff"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Dynamic Pulse Line -->
  <path
    d="M26 60 L44 60 L50 48 L58 72 L65 52 L71 63 L77 60 L94 60"
    fill="none"
    stroke="#0f766e"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
